<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clase 10 - Fetch API y Librerías Externas en JavaScript</title>

  <!-- Librerías externas vía CDN, como explica el módulo 10.2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.js"></script>
</head>
<body>
  <h1>Mi Netflix</h1>

  <!-- Botones de demo para SweetAlert2 y Toastify (10.2): cada uno
       dispara un ejemplo distinto al hacer clic, en vez de que los 3
       modales/toasts aparezcan todos juntos apenas carga la página. -->
  <button id="btn-demo-swal-exito">Demo: SweetAlert2 (éxito)</button>
  <button id="btn-demo-swal-confirmar">Demo: SweetAlert2 (confirmar borrado)</button>
  <button id="btn-demo-toast">Demo: Toastify</button>

  <!-- Elementos para el ejemplo resuelto de la Pre-Entrega 10 -->
  <p id="estado-carga"></p>
  <ul id="lista-personajes"></ul>
  <button id="btn-recargar-personajes">Recargar personajes</button>

  <script src="script.js" defer></script>
</body>
</html>
