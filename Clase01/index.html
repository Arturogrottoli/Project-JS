<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clase 01</title>

  <!-- FORMA 2: JavaScript dentro de una etiqueta <script> en el HTML -->
  <script>
    console.log("Hola desde el <script> del HTML")
  </script>
</head>
<body>
  <h1>Clase 01</h1>

  <!-- FORMA 1: JavaScript adentro de una etiqueta (inline) -->
  <button onclick="alert('Hola desde el botón')">Click</button>

  <!-- FORMA 3: JavaScript en un archivo externo (la recomendada).
       Va al final del body, abajo de todo el HTML. -->
  <script src="script.js"></script>
</body>
</html>
