<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MiniFlix</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- Librería Toastify CSS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <header>
    <h1>🎬 MiniFlix</h1>
    <p>Catálogo de películas y series</p>
  </header>

  <section class="filters">
    <select id="filterType">
      <option value="">Todos</option>
      <option value="Película">Películas</option>
      <option value="Serie">Series</option>
    </select>

    <select id="filterCategory">
      <option value="">Todas las categorías</option>
    </select>
  </section>

  <main id="catalog"></main>

  <aside>
    <h2>⭐ Mi lista</h2>
    <button id="btnVaciarLista">Vaciar lista</button>
    <div id="myListCards"></div>

  </aside>

  <!-- Librería SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Librería Toastify JS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script src="js/app.js"></script>
</body>
</html>
